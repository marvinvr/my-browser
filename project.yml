name: myBrowser
options:
  bundleIdPrefix: org.mybrowser
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES

targets:
  myBrowser:
    type: application
    platform: macOS
    sources:
      - path: myBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mybrowser.app
        PRODUCT_NAME: myBrowser
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: myBrowser
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    info:
      path: myBrowser/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    scheme:
      testTargets:
        - myBrowserTests

  myBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: myBrowserTests
    dependencies:
      - target: myBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mybrowser.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/myBrowser.app/Contents/MacOS/myBrowser"
