name: myBrowser
options:
  bundleIdPrefix: ch.marvinvr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
    # Empty in Debug so the Info.plist key is blank and sync stays off. Release overrides it.
    MB_CLOUDKIT_CONTAINER: ""

targets:
  myBrowser:
    type: application
    platform: macOS
    sources:
      - path: myBrowser
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.marvinvr.mybrowser
        PRODUCT_NAME: myBrowser
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: myBrowser
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Debug stays ad-hoc. scripts/release.sh signs Release with Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Debug stays ad-hoc (base CODE_SIGN_IDENTITY "-"). Release embeds the
          # Developer ID profile so the iCloud entitlements are allowed at launch.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: WZ6VURTF6A
          PROVISIONING_PROFILE_SPECIFIER: "myBrowser Developer ID (Molty)"
          CODE_SIGN_ENTITLEMENTS: myBrowser/myBrowser-iCloud.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          MB_CLOUDKIT_CONTAINER: iCloud.ch.marvinvr.mybrowser
    dependencies:
      - package: Sparkle
    info:
      path: myBrowser/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        SUFeedURL: https://raw.githubusercontent.com/marvinvr/my-browser/main/appcast.xml
        SUPublicEDKey: "CiZk8aNFb6vYzST1ZCGdDJJOTZ5fGjBEDJbpP/a9xzM="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        MBCloudKitContainer: $(MB_CLOUDKIT_CONTAINER)
        # Required before Apple will grant com.apple.developer.web-browser.public-key-credential.
        CFBundleURLTypes:
          - CFBundleURLName: ch.marvinvr.mybrowser.web
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - http
              - https
    scheme:
      testTargets:
        - myBrowserTests

  myBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: myBrowserTests
    dependencies:
      - target: myBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.marvinvr.mybrowser.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/myBrowser.app/Contents/MacOS/myBrowser"
